<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Find Odd Color</title>
    <!-- CSS -->
    <link rel="stylesheet" href="./style.css" />
    <!-- Google font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Orbitron:wght@400..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="main-box">
      <!-- ---------- Title ---------- -->
      <h2 class="title">
        Find
        <span class="title--border">Odd</span>
        <span class="title--rgb">Color</span>
        <span class="title--game">Game</span>
      </h2>

      <!-- ---------- Scores box ---------- -->
      <div class="scores">
        <p>Highest score: <span class="high-score">0</span></p>
        <p class="scores--currentScore">
          Score: <span class="current-score">0</span>
        </p>
      </div>

      <!-- ---------- Squares box ---------- -->
      <div class="squares">
        <div class="colored-square"></div>
        <div class="colored-square"></div>
        <div class="colored-square"></div>
        <div class="colored-square"></div>
        <div class="colored-square"></div>
        <div class="colored-square"></div>
        <div class="colored-square"></div>
        <div class="colored-square"></div>
        <div class="colored-square"></div>
        <div class="colored-square"></div>
        <div class="colored-square"></div>
        <div class="colored-square"></div>
        <div class="colored-square"></div>
        <div class="colored-square"></div>
        <div class="colored-square"></div>
        <div class="colored-square"></div>

        <!-- ---------- Losing screen box ---------- -->
        <div class="losing-screen hidden">
          <p>You Lose</p>
          <button>Play Again</button>
        </div>
      </div>
    </div>

    <!-- JavaScript -->
    <script src="./script.js"></script>
  </body>
</html>
